services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mydaily_backend
    restart: always
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-in-production-random-secret-key-prod-1234
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL=True
      - DJANGO_LOG_LEVEL=INFO
    volumes:
      - backend_data:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mydaily_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: mydaily_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:

